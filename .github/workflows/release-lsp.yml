name: Release LSP

on:
  push:
    tags:
      - 'lsp-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0-alpha.37)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: src/XamlToCSharpGenerator.LanguageServer/XamlToCSharpGenerator.LanguageServer.csproj

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#lsp-v}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=lsp-v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath xaml-lsp-win-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: xaml-lsp v${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: xaml-lsp-win-x64.zip
